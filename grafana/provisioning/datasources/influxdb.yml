apiVersion: 1

datasources:
  - name: FrioCerto InfluxDB
    uid: friocerto-influx
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8086
    isDefault: true
    editable: true
    jsonData:
      version: Flux
      organization: friocerto
      defaultBucket: sensores
      httpMode: POST
      timeInterval: 2s
    secureJsonData:
      token: $INFLUX_TOKEN
