[agent]
  interval = "10s"
  flush_interval = "2s"
  omit_hostname = true

# MQTT da Parte A: friocerto/<regiao>/<cidade>/<loja>/<camara>/leitura
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["friocerto/abc/+/+/+/leitura"]
  qos = 1
  client_id = "friocerto-telegraf-leituras"
  name_override = "temperatura_camara"
  data_format = "json"
  tag_keys = ["regiao", "cidade", "loja", "camara"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"

# Evento de alerta MQTT QoS 2, em measurement separado (Parte A, Q3).
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["friocerto/abc/+/+/+/alerta"]
  qos = 2
  client_id = "friocerto-telegraf-alertas"
  name_override = "alerta_evento"
  data_format = "json"
  tag_keys = ["regiao", "cidade", "loja", "camara"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "friocerto"
  bucket = "sensores"
